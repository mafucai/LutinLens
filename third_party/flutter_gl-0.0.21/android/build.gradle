group 'com.futouapp.flutter_gl.flutter_gl'
version '1.0-SNAPSHOT'

buildscript {
    // 与根项目 android/settings.gradle 对齐：AGP 8.11.1 / Kotlin 2.1.0。
    // 原值 AGP 7.3.0 + Kotlin 1.7.10 无法接受 compileSdkVersion 36。
    ext.kotlin_version = '2.1.0'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        // Project-local Maven repo for vendored threeegl AAR
        maven { url uri("${rootProject.projectDir}/maven-repo") }
        mavenLocal()
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.futouapp.flutter_gl.flutter_gl"
    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 24
    }
    lint {
        disable 'InvalidPackage'
    }

    // Align Java and Kotlin targets with AGP/JDK 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'

    // Use threeegl via Maven coordinates (installed into mavenLocal)
    implementation 'com.threeegl:threeegl:0.0.1'
}

// Fallback: ensure all KotlinCompile tasks target JVM 17
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}
